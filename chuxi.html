<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { 
  -webkit-font-smoothing: antialiased;
  background: #0d0d0d;
}
body {
  font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  background: 
    radial-gradient(ellipse at top, #1a1512 0%, #0d0d0d 50%),
    linear-gradient(180deg, #1a0808 0%, #0d0505 100%);
  min-height: 100vh;
  color: #f0e6d8;
  position: relative;
  overflow-x: hidden;
}
/* 背景装饰 */
.bg-pattern {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 25%),
    radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 25%),
    radial-gradient(circle at 50% 50%, rgba(139, 0, 0, 0.1) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
.floating {
  position: fixed;
  font-size: 20px;
  opacity: 0.12;
  animation: float 8s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}
.f1 { top: 5%; left: 8%; animation-delay: 0s; }
.f2 { top: 15%; right: 10%; animation-delay: 1s; }
.f3 { top: 40%; left: 5%; animation-delay: 2s; }
.f4 { top: 60%; right: 8%; animation-delay: 3s; }
.f5 { top: 80%; left: 12%; animation-delay: 4s; }
.f6 { top: 90%; right: 15%; animation-delay: 5s; }
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(5deg); }
}

.container {
  max-width: 400px;
  margin: 0 auto;
  padding: 25px 18px 40px;
  position: relative;
  z-index: 1;
}

/* 顶部 */
.header {
  text-align: center;
  padding: 20px 0 30px;
}
.logo {
  font-size: 64px;
  margin-bottom: 8px;
  filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
  animation: pulse-glow 2.5s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25)); }
  50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.45)); }
}
h1 {
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 36px;
  background: linear-gradient(180deg, #ffd700 0%, #c9a227 50%, #ffd700 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 8px;
  margin-bottom: 6px;
  text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
}
.subtitle {
  color: #b8963e;
  font-size: 14px;
  letter-spacing: 3px;
  font-weight: 300;
}

/* 主卡片 */
.main-card {
  background: linear-gradient(145deg, 
    rgba(35, 20, 15, 0.95) 0%, 
    rgba(25, 15, 10, 0.98) 100%);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 20px;
  padding: 28px 22px;
  margin: 0 0 25px;
  position: relative;
  overflow: hidden;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 215, 0, 0.05) inset,
    0 1px 0 rgba(255, 215, 0, 0.1) inset;
}
.main-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.4), transparent);
}
.main-card::after {
  content: '🐴';
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 50px;
  opacity: 0.08;
}
.blessing-title {
  text-align: center;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 26px;
  color: #ffd700;
  margin-bottom: 18px;
  letter-spacing: 4px;
}
.blessing-words {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px 18px;
}
.blessing-item {
  font-size: 15px;
  color: #f5e6d3;
  letter-spacing: 1px;
  padding: 6px 0;
  white-space: nowrap;
}
.blessing-item span {
  margin-right: 4px;
}

/* 服务卡片 */

.service-card {

.service-card:hover {

.service-row {

  margin-bottom: 12px;
}
.service-info {

}
.service-title {

.service-title .icon {

}
.service-desc {

  font-size: 12px;
  line-height: 1.5;
}
.service-price {
  text-align: right;
  padding-left: 15px;
}
.price {
  font-size: 22px;
  color: #ff6b6b;
  font-weight: 600;
  display: block;
}
.price-orig {
  font-size: 12px;
  color: #555;
  text-decoration: line-through;
  display: block;
  margin-top: 2px;
}
.btn {
  display: block;
  width: 100%;
  padding: 12px 20px;
  border-radius: 25px;
  cursor: pointer;
  border: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.3s ease;
  letter-spacing: 1px;
}
.btn-gold {
  background: linear-gradient(145deg, #d4af37 0%, #aa8a2a 100%);
  color: #1a0f0a;
  box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
}
.btn-gold:hover {
  background: linear-gradient(145deg, #e5c048 0%, #c19a2b 100%);

  box-shadow: 0 6px 25px rgba(212, 175, 55, 0.4);
}
.btn-outline {
  background: transparent;
  border: 1px solid rgba(212, 175, 55, 0.4);
  color: #d4af37;
}
.btn-outline:hover {

.footer a {

/* 装饰边框 */
.corner {
  position: fixed;
  width: 60px;
  height: 60px;
  border: 2px solid rgba(212, 175, 55, 0.15);
  pointer-events: none;
  z-index: 0;
}
.corner-tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
.corner-tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
.corner-bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
.corner-br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

/* 闪动光效 */
@keyframes shine {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.shine {
  background: linear-gradient(90deg, 
    rgba(255,215,0,0) 0%,

    rgba(255,215,0,0) 100%);

  -webkit-background-clip: text;
  animation: shine 3s linear infinite;
}

<script>
// 春节日期（2026年）
const SPRING_FESTIVAL = new Date('2026-02-17'); // 农历正月初一
const FESTIVAL_DATES = {

    'chuxi': { date: '2026-02-16', title: '除夕', subtitle: '辞旧岁，迎新春', words: ['团圆美满', '岁岁平安', '万事如意'] },

    'chun2': { date: '2026-02-18', title: '春节', subtitle: '正月初二 · 回娘家', words: ['回娘家', '亲情浓', '幸福满'] },
    'chun3': { date: '2026-02-19', title: '春节', subtitle: '正月初三 · 贴赤口', words: ['和气生财', '家和万事兴', '出入平安'] },
    'chun4': { date: '2026-02-20', title: '春节', subtitle: '正月初四 · 迎灶神', words: ['灶神到', '福气满', '财运来'] },
    'chun5': { date: '2026-02-21', title: '春节', subtitle: '正月初五 · 迎财神', words: ['财源滚滚', '金玉满堂', '日进斗金'] },
    'chun6': { date: '2026-02-22', title: '春节', subtitle: '正月初六 · 送穷鬼', words: ['送穷鬼', '迎福气顺', '万事'] },
    'chun7': { date: '2026-02-23', title: '春节', subtitle: '正月初七 · 人日', words: ['人日快乐', '安居乐业', '心想事成'] },
    // 元宵
    'yuanxiao': { date: '2026-03-03', title: '元宵节', subtitle: '正月十五 · 上元灯会', words: ['元宵快乐', '花灯璀璨', '团团圆圆'] },
    // 春节后通用
    'spring': { date: '2026-02-24', title: '新春', subtitle: '春回大地 · 万物复苏', words: ['春暖花开', '万象更新', '祝福常在'] }
};

const BLESSING_ICONS = ['💎', '🏮', '🍊', '🎊', '🧧', '✨', '🎆', '🏮', '💰', '🎯'];

function getGreeting() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    const todayStr = today.toISOString().split('T')[0];
    
    // 排序检查
    const entries = Object.entries(FESTIVAL_DATES).sort((a, b) => 
        new Date(b[1].date) - new Date(a[1].date));
    
    for (const [key, val] of entries) {
        const festivalDate = new Date(val.date);
        if (today >= festivalDate) {
            return val;
        }
    }
    
    return { title: '新春', subtitle: '祝福常在', words: ['万事如意', '心想事成', '平安喜乐'] };
}

function updateGreeting() {
    const greeting = getGreeting();
    
    // 更新标题
    const subtitleEl = document.getElementById('greeting-subtitle');
    if (subtitleEl) {
        subtitleEl.textContent = greeting.subtitle;
    }
    const titleEl = document.getElementById('greeting-title');
    if (titleEl) {
        titleEl.textContent = greeting.title;
    }
    
    // 更新祝福语
    const wordsContainer = document.getElementById('blessing-words');
    if (wordsContainer && greeting.words) {
        wordsContainer.innerHTML = greeting.words.map((word, i) => 
            `<div class="blessing-item"><span>${BLESSING_ICONS[i % BLESSING_ICONS.length]}</span>${word}</div>`
        ).join('');
    }
}

// 页面加载后更新
document.addEventListener('DOMContentLoaded', updateGreeting);
</script>
